[package]
name = "lsn"
version = "0.1.0"
edition = "2024"
description = "Explore files in the terminal via a tree view"
authors = ["Marek Markiewka <info@marma.dev>"]
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.47", features = ["derive", "cargo", "wrap_help"] }
color-eyre = "0.6.3"
crossterm = "0.28.1"
libc = "0.2.161"
ratatui = "0.29.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.9.0"
tempfile = "3.22.0"

[build-dependencies]
anyhow = "1.0.90"
vergen-gix = { version = "1.0.2", features = ["build", "cargo"] }
